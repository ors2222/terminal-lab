<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Rebel campaign: not a uniform unless you say so</title>
  <desc id="desc">A plain white T-shirt sits amid oversized, sharply cropped lettering and bold color blocks; the graphics do not alter the shirt.</desc>
  <rect width="960" height="500" fill="#f5eddf"/>
  <path d="M0 0H450L340 145H0Z" fill="#ff573d"/>
  <path d="M625 0H960V190L830 150Z" fill="#b7df45"/>
  <path d="M0 355L260 300L360 500H0Z" fill="#252525"/>
  <path d="M760 285H960V500H630Z" fill="#4246cf"/>
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900">
    <text x="-18" y="115" fill="#252525" font-size="66" transform="rotate(-7 20 115)">NOT A</text>
    <text x="666" y="103" fill="#252525" font-size="23" transform="rotate(8 666 103)">WHO DECIDES?</text>
    <text x="34" y="450" fill="#f5eddf" font-size="21" transform="rotate(-8 34 450)">YOUR CALL.</text>
    <text x="640" y="462" fill="#fff" font-size="45" transform="rotate(-8 640 462)">UNIFORM?</text>
  </g>
  <g stroke="#252525" stroke-width="5" stroke-linejoin="round">
    <path d="M400 173 L454 137 L494 155 L534 137 L588 173 L562 228 L539 212 L539 347 L449 347 L449 212 L426 228 Z" fill="#fff"/>
    <path d="M474 151 Q494 174 514 151" fill="none" stroke-width="3"/>
  </g>
  <path d="M365 246L394 255 M590 254L621 245 M407 365L386 393 M563 364L582 390" stroke="#252525" stroke-width="5"/>
</svg>
